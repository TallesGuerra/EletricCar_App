      <path d="M4,28 C2,24 2,16 10,12 L18,8 C28,3 42,0 56,0 L92,0 C104,0 110,6 112,16 C114,22 116,26 116,28 L4,28 Z" fill="#D0D0D0"/>
      <path d="M55,0 L82,0 L82,22 L52,22 Z" fill="#8AADB8" opacity="0.82"/>
      <path d="M84,0 L92,0 C104,0 110,6 112,16 L112,22 L84,22 Z" fill="#8AADB8" opacity="0.82"/>
      <rect x="82" y="0" width="2" height="22" fill="#C2C2C2"/>
      <rect x="10" y="24" width="106" height="4" rx="1" fill="#BBBBBB"/>
      <circle cx="24" cy="40" r="9" fill="#2E2E2E"/>
      <circle cx="24" cy="40" r="5.5" fill="#666"/>
      <circle cx="24" cy="40" r="2" fill="#3A3A3A"/>
      <circle cx="96" cy="40" r="9" fill="#2E2E2E"/>
      <circle cx="96" cy="40" r="5.5" fill="#666"/>
      <circle cx="96" cy="40" r="2" fill="#3A3A3A"/>
      <rect x="6" y="15" width="6" height="5" rx="1.5" fill="#EEEAC0" opacity="0.8"/>
      <rect x="110" y="15" width="5" height="9" rx="1.5" fill="#C06060" opacity="0.7"/>
    </symbol>
  </defs>

  <!-- Phone shell -->
  <rect x="2" y="2" width="196" height="426" rx="28" fill="#1a1a1a"/>
  <!-- Buttons -->
  <rect x="0" y="82" width="2" height="18" rx="1" fill="#2e2e2e"/>
  <rect x="0" y="106" width="2" height="30" rx="1" fill="#2e2e2e"/>
  <rect x="198" y="100" width="2" height="30" rx="1" fill="#2e2e2e"/>

  <!-- Screen -->
  <rect x="10" y="10" width="180" height="410" rx="20" fill="#FAFAFA"/>

  <g clip-path="url(#screen)">
    <!-- Dynamic island -->
    <rect x="74" y="15" width="52" height="12" rx="6" fill="#1a1a1a"/>

    <!-- STATUS BAR -->
    <text x="22" y="33" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#333">12:01</text>
    <circle cx="136" cy="32" r="1.2" fill="#444"/>
    <path d="M132,29 Q136,25 140,29" fill="none" stroke="#444" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M129,26.5 Q136,21 143,26.5" fill="none" stroke="#444" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="147" y="28" width="2" height="5" rx="0.5" fill="#444"/>
    <rect x="151" y="26" width="2" height="7" rx="0.5" fill="#444"/>
    <rect x="155" y="24" width="2" height="9" rx="0.5" fill="#444"/>
    <rect x="161" y="24" width="16" height="9" rx="2" fill="none" stroke="#444" stroke-width="1"/>
    <rect x="177" y="27" width="2" height="3" rx="0.5" fill="#444"/>
    <rect x="162" y="25" width="14" height="7" rx="1" fill="#444"/>

    <!-- APP BAR -->
    <text x="20" y="59" font-family="sans-serif" font-size="15" font-weight="400" fill="#1A1A1A">Eletric Car</text>

    <!-- TAB BAR -->
    <text x="60" y="78" font-family="sans-serif" font-size="9" font-weight="700" fill="#00796B" text-anchor="middle" letter-spacing="1">CARROS</text>
    <rect x="18" y="81" width="84" height="2" rx="1" fill="#00796B"/>
    <text x="148" y="78" font-family="sans-serif" font-size="9" font-weight="700" fill="#AAAAAA" text-anchor="middle" letter-spacing="1">FAVORITOS</text>
    <line x1="10" y1="84" x2="190" y2="84" stroke="#E0E0E0" stroke-width="0.7"/>

    <!-- CARD 1 -->
    <rect x="18" y="90" width="164" height="110" rx="10" fill="#ECECEC"/>
    <use href="#car" x="31" y="95" width="120" height="50"/>
    <text x="175" y="106" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">☆</text>
    <text x="26" y="158" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Preço</text>
    <text x="66" y="158" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">R$ 300.000,00</text>
    <text x="26" y="169" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Bateria</text>
    <text x="66" y="169" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">300 kWh</text>
    <text x="26" y="180" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Potência</text>
    <text x="66" y="180" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">200cv</text>
    <text x="26" y="191" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Recarga</text>
    <text x="66" y="191" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">30 min</text>

    <!-- CARD 2 -->
    <rect x="18" y="206" width="164" height="110" rx="10" fill="#ECECEC"/>
    <use href="#car" x="31" y="211" width="120" height="50"/>
    <text x="175" y="222" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">☆</text>
    <text x="26" y="274" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Preço</text>
    <text x="66" y="274" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">R$ 200.000,00</text>
    <text x="26" y="285" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Bateria</text>
    <text x="66" y="285" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">230 kWh</text>
    <text x="26" y="296" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Potência</text>
    <text x="66" y="296" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">100cv</text>
    <text x="26" y="307" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Recarga</text>
    <text x="66" y="307" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">20 min</text>

    <!-- CARD 3 (partial) -->
    <rect x="18" y="322" width="164" height="110" rx="10" fill="#ECECEC"/>
    <use href="#car" x="31" y="327" width="120" height="50"/>
    <text x="175" y="338" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">☆</text>
    <text x="26" y="390" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Preço</text>
    <text x="66" y="390" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">R$ 554.000,00</text>
    <text x="26" y="401" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Bateria</text>
    <text x="66" y="401" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">430 kWh</text>
    <text x="26" y="412" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1A1A1A">Potência</text>
    <text x="66" y="412" font-family="sans-serif" font-size="8.5" fill="#1A1A1A">400cv</text>

    <!-- FAB -->
    <circle cx="178" cy="385" r="18" fill="#00897B"/>
    <rect x="170" y="378" width="16" height="14" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
    <rect x="172" y="380.5" width="5" height="3" rx="0.8" fill="white"/>
    <circle cx="182" cy="382" r="1.3" fill="white"/>
    <rect x="172" y="386" width="3" height="3" rx="0.7" fill="white"/>
    <rect x="176.5" y="386" width="3" height="3" rx="0.7" fill="white"/>
    <rect x="181" y="386" width="3" height="3" rx="0.7" fill="white"/>

    <!-- Bottom home bar -->
    <rect x="76" y="413" width="48" height="3.5" rx="2" fill="rgba(0,0,0,0.2)"/>

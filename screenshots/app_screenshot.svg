<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="sans-serif">

  <!-- Phone background -->
  <rect width="360" height="720" fill="#FFFFFF"/>

  <!-- Status bar -->
  <rect width="360" height="28" fill="#FFFFFF"/>
  <text x="16" y="20" font-size="13" font-weight="600" fill="#000">12:01</text>
  <!-- Battery icon -->
  <rect x="326" y="9" width="22" height="11" rx="2" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="348" y="12" width="2" height="5" rx="1" fill="#000"/>
  <rect x="327.5" y="10.5" width="18" height="8" rx="1" fill="#000"/>
  <!-- Signal bars -->
  <rect x="304" y="14" width="3" height="6" rx="0.5" fill="#000"/>
  <rect x="309" y="11" width="3" height="9" rx="0.5" fill="#000"/>
  <rect x="314" y="8" width="3" height="12" rx="0.5" fill="#000"/>
  <!-- Wifi -->
  <path d="M292 18 Q296 14 300 18" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M289 15 Q296 9 303 15" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="296" cy="20" r="1.5" fill="#000"/>

  <!-- App bar -->
  <rect y="28" width="360" height="56" fill="#FFFFFF"/>
  <text x="16" y="65" font-size="22" font-weight="400" fill="#000000">Eletric Car</text>

  <!-- Tab bar -->
  <rect y="84" width="360" height="48" fill="#FFFFFF"/>
  <!-- Tab CARROS (selected) -->
  <text x="90" y="114" font-size="13" font-weight="700" fill="#00796B" text-anchor="middle" letter-spacing="1">CARROS</text>
  <rect x="20" y="130" width="140" height="2" fill="#00796B"/>
  <!-- Tab FAVORITOS -->
  <text x="270" y="114" font-size="13" font-weight="700" fill="#9E9E9E" text-anchor="middle" letter-spacing="1">FAVORITOS</text>

  <!-- Divider -->
  <rect y="132" width="360" height="1" fill="#E0E0E0"/>

  <!-- ===================== CARD 1 ===================== -->
  <rect x="16" y="144" width="328" height="180" rx="16" fill="#EFEFEF"/>

  <!-- Car image area -->
  <g transform="translate(40, 150)">
    <!-- Tesla Model 3 simplified SVG -->
    <!-- Body -->
    <ellipse cx="140" cy="95" rx="120" ry="18" fill="#C8C8C8" opacity="0.4"/>
    <!-- Main body -->
    <path d="M30 88 Q32 62 80 55 Q110 48 140 48 Q170 48 200 55 Q248 62 250 88 L250 98 Q200 105 140 105 Q80 105 30 98 Z" fill="#D8D8D8"/>
    <!-- Roof -->
    <path d="M85 55 Q100 30 140 28 Q180 30 195 55 Z" fill="#CCCCCC"/>
    <!-- Windows -->
    <path d="M88 54 Q100 36 130 34 Q130 54 88 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <path d="M132 34 Q162 34 170 54 Q150 54 132 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <!-- Front -->
    <path d="M240 75 Q255 78 258 88 L250 88 Z" fill="#C0C0C0"/>
    <!-- Rear -->
    <path d="M30 88 L22 88 Q20 82 30 78 Z" fill="#C0C0C0"/>
    <!-- Wheels -->
    <circle cx="75" cy="100" r="16" fill="#555"/>
    <circle cx="75" cy="100" r="8" fill="#888"/>
    <circle cx="75" cy="100" r="3" fill="#555"/>
    <circle cx="205" cy="100" r="16" fill="#555"/>
    <circle cx="205" cy="100" r="8" fill="#888"/>
    <circle cx="205" cy="100" r="3" fill="#555"/>
    <!-- Door line -->
    <path d="M120 55 L118 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <path d="M162 53 L160 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <!-- Handle -->
    <rect x="104" y="72" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
    <rect x="146" y="71" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
  </g>

  <!-- Star icon card 1 -->
  <polygon points="328,156 331,164 340,164 333,169 336,178 328,173 320,178 323,169 316,164 325,164" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- Card 1 details -->
  <text x="32" y="272" font-size="13" font-weight="700" fill="#000">Preço</text>
  <text x="110" y="272" font-size="13" fill="#000">R$ 300.000,00</text>
  <text x="32" y="290" font-size="13" font-weight="700" fill="#000">Bateria</text>
  <text x="110" y="290" font-size="13" fill="#000">300 kWh</text>
  <text x="32" y="308" font-size="13" font-weight="700" fill="#000">Potência</text>
  <text x="110" y="308" font-size="13" fill="#000">200cv</text>
  <text x="32" y="326" font-size="13" font-weight="700" fill="#000">Recarga</text>
  <text x="110" y="326" font-size="13" fill="#000">30 min</text>

  <!-- ===================== CARD 2 ===================== -->
  <rect x="16" y="336" width="328" height="180" rx="16" fill="#EFEFEF"/>

  <!-- Car image card 2 -->
  <g transform="translate(40, 342)">
    <ellipse cx="140" cy="95" rx="120" ry="18" fill="#C8C8C8" opacity="0.4"/>
    <path d="M30 88 Q32 62 80 55 Q110 48 140 48 Q170 48 200 55 Q248 62 250 88 L250 98 Q200 105 140 105 Q80 105 30 98 Z" fill="#D8D8D8"/>
    <path d="M85 55 Q100 30 140 28 Q180 30 195 55 Z" fill="#CCCCCC"/>
    <path d="M88 54 Q100 36 130 34 Q130 54 88 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <path d="M132 34 Q162 34 170 54 Q150 54 132 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <path d="M240 75 Q255 78 258 88 L250 88 Z" fill="#C0C0C0"/>
    <path d="M30 88 L22 88 Q20 82 30 78 Z" fill="#C0C0C0"/>
    <circle cx="75" cy="100" r="16" fill="#555"/>
    <circle cx="75" cy="100" r="8" fill="#888"/>
    <circle cx="75" cy="100" r="3" fill="#555"/>
    <circle cx="205" cy="100" r="16" fill="#555"/>
    <circle cx="205" cy="100" r="8" fill="#888"/>
    <circle cx="205" cy="100" r="3" fill="#555"/>
    <path d="M120 55 L118 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <path d="M162 53 L160 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <rect x="104" y="72" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
    <rect x="146" y="71" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
  </g>

  <!-- Star icon card 2 -->
  <polygon points="328,348 331,356 340,356 333,361 336,370 328,365 320,370 323,361 316,356 325,356" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- Card 2 details -->
  <text x="32" y="464" font-size="13" font-weight="700" fill="#000">Preço</text>
  <text x="110" y="464" font-size="13" fill="#000">R$ 200.000,00</text>
  <text x="32" y="482" font-size="13" font-weight="700" fill="#000">Bateria</text>
  <text x="110" y="482" font-size="13" fill="#000">230 kWh</text>
  <text x="32" y="500" font-size="13" font-weight="700" fill="#000">Potência</text>
  <text x="110" y="500" font-size="13" fill="#000">100cv</text>
  <text x="32" y="518" font-size="13" font-weight="700" fill="#000">Recarga</text>
  <text x="110" y="518" font-size="13" fill="#000">20 min</text>

  <!-- ===================== CARD 3 (partial) ===================== -->
  <rect x="16" y="528" width="328" height="192" rx="16" fill="#EFEFEF"/>
  <clipPath id="card3clip">
    <rect x="16" y="528" width="328" height="192"/>
  </clipPath>

  <!-- Car image card 3 -->
  <g transform="translate(40, 534)" clip-path="url(#card3clip)">
    <ellipse cx="140" cy="95" rx="120" ry="18" fill="#C8C8C8" opacity="0.4"/>
    <path d="M30 88 Q32 62 80 55 Q110 48 140 48 Q170 48 200 55 Q248 62 250 88 L250 98 Q200 105 140 105 Q80 105 30 98 Z" fill="#D8D8D8"/>
    <path d="M85 55 Q100 30 140 28 Q180 30 195 55 Z" fill="#CCCCCC"/>
    <path d="M88 54 Q100 36 130 34 Q130 54 88 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <path d="M132 34 Q162 34 170 54 Q150 54 132 54 Z" fill="#B8C8D0" opacity="0.8"/>
    <path d="M240 75 Q255 78 258 88 L250 88 Z" fill="#C0C0C0"/>
    <path d="M30 88 L22 88 Q20 82 30 78 Z" fill="#C0C0C0"/>
    <circle cx="75" cy="100" r="16" fill="#555"/>
    <circle cx="75" cy="100" r="8" fill="#888"/>
    <circle cx="75" cy="100" r="3" fill="#555"/>
    <circle cx="205" cy="100" r="16" fill="#555"/>
    <circle cx="205" cy="100" r="8" fill="#888"/>
    <circle cx="205" cy="100" r="3" fill="#555"/>
    <path d="M120 55 L118 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <path d="M162 53 L160 98" fill="none" stroke="#BBBBBB" stroke-width="1"/>
    <rect x="104" y="72" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
    <rect x="146" y="71" width="12" height="3" rx="1.5" fill="#BBBBBB"/>
  </g>

  <!-- Star icon card 3 -->
  <polygon points="328,540 331,548 340,548 333,553 336,562 328,557 320,562 323,553 316,548 325,548" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- Card 3 details (partially visible) -->
  <text x="32" y="656" font-size="13" font-weight="700" fill="#000">Preço</text>
  <text x="110" y="656" font-size="13" fill="#000">R$ 554.000,00</text>
  <text x="32" y="674" font-size="13" font-weight="700" fill="#000">Bateria</text>
  <text x="110" y="674" font-size="13" fill="#000">430 kWh</text>
  <text x="32" y="692" font-size="13" font-weight="700" fill="#000">Potência</text>
  <text x="110" y="692" font-size="13" fill="#000">400cv</text>
  <text x="32" y="710" font-size="13" font-weight="700" fill="#000">Recarga</text>
  <text x="110" y="710" font-size="13" fill="#000">60 min</text>

  <!-- FAB (Floating Action Button) -->
  <circle cx="316" cy="672" r="28" fill="#00897B"/>
  <!-- Calculator icon inside FAB -->
  <rect x="304" y="660" width="24" height="24" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <rect x="307" y="663" width="7" height="5" rx="1" fill="white"/>
  <rect x="318" y="663" width="7" height="5" rx="1" fill="white"/>
  <rect x="307" y="672" width="4" height="4" rx="1" fill="white"/>
  <rect x="314" y="672" width="4" height="4" rx="1" fill="white"/>
  <rect x="321" y="672" width="4" height="4" rx="1" fill="white"/>
  <rect x="307" y="679" width="4" height="4" rx="1" fill="white"/>
  <rect x="314" y="679" width="4" height="4" rx="1" fill="white"/>
  <rect x="321" y="679" width="4" height="4" rx="1" fill="white"/>

  <!-- Bottom navigation bar -->
  <rect y="700" width="360" height="20" fill="#FFFFFF"/>
  <!-- Back button (triangle) -->
  <polygon points="80,713 90,706 90,720" fill="#000" opacity="0.7"/>
  <!-- Home button (circle) -->
  <circle cx="180" cy="713" r="8" fill="none" stroke="#000" stroke-width="2" opacity="0.7"/>
  <!-- Recents button (square) -->
  <rect x="262" y="706" width="14" height="14" rx="2" fill="none" stroke="#000" stroke-width="2" opacity="0.7"/>

</svg>
